<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Management API - Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="header-title">
        <h1>Task Management API</h1>
        <p class="subtitle">Manage your tasks powered by FastAPI &amp; SQLite</p>
      </div>
      <div class="api-badge">
        <span class="status-dot"></span> Backend Connected
      </div>
    </header>

    <!-- Error / Success Alert Message Container -->
    <div id="alertContainer" class="alert-container hidden">
      <span id="alertMessage"></span>
      <button id="alertCloseBtn" onclick="closeAlert()">&times;</button>
    </div>

    <!-- Stats Dashboard Cards -->
    <section class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">Total Tasks</span>
        <span id="totalTasksCount" class="stat-number">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Completed Tasks</span>
        <span id="completedTasksCount" class="stat-number stat-completed">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Pending Tasks</span>
        <span id="pendingTasksCount" class="stat-number stat-pending">0</span>
      </div>
    </section>

    <!-- Create Task Form Section -->
    <section class="card form-card">
      <h2 class="card-title">Create a Task</h2>
      <form id="createTaskForm">
        <div class="form-group">
          <label for="taskTitle">Task Title <span class="required">*</span></label>
          <input type="text" id="taskTitle" placeholder="e.g. Learn FastAPI REST Architecture" required maxlength="255">
        </div>
        <div class="form-group">
          <label for="taskDescription">Description</label>
          <textarea id="taskDescription" rows="3" placeholder="Optional details about this task..."></textarea>
        </div>
        <button type="submit" id="createSubmitBtn" class="btn btn-primary">
          <span>+ Create Task</span>
        </button>
      </form>
    </section>

    <!-- Task List & Filter Controls Section -->
    <section class="card tasks-section">
      <div class="tasks-header">
        <h2 class="card-title">Tasks</h2>
        <div class="filter-group">
          <span class="filter-label">Filter:</span>
          <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">All</button>
          <button class="filter-btn" data-filter="pending" onclick="setFilter('pending')">Pending</button>
          <button class="filter-btn" data-filter="completed" onclick="setFilter('completed')">Completed</button>
        </div>
      </div>

      <!-- Loading State Indicator -->
      <div id="loadingIndicator" class="loading-state hidden">
        <div class="spinner"></div>
        <p>Loading tasks from FastAPI backend...</p>
      </div>

      <!-- Task Cards Container -->
      <div id="taskList" class="task-list"></div>

      <!-- Empty List State -->
      <div id="emptyState" class="empty-state hidden">
        <p class="empty-title">No tasks found</p>
        <p class="empty-sub">Create a new task above or select a different filter.</p>
      </div>
    </section>
  </div>

  <!-- Edit Task Modal Dialog -->
  <div id="editModal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Edit Task</h3>
        <button class="modal-close" onclick="closeEditModal()">&times;</button>
      </div>
      <form id="editTaskForm">
        <input type="hidden" id="editTaskId">
        <div class="form-group">
          <label for="editTaskTitle">Task Title <span class="required">*</span></label>
          <input type="text" id="editTaskTitle" required maxlength="255">
        </div>
        <div class="form-group">
          <label for="editTaskDescription">Description</label>
          <textarea id="editTaskDescription" rows="3"></textarea>
        </div>
        <div class="form-group checkbox-group">
          <label>
            <input type="checkbox" id="editTaskCompleted">
            Mark as Completed
          </label>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
